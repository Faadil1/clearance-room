name: Product quality

on:
  pull_request:
  push:
    branches:
      - product/judge-workflow-4
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      - name: Install
        run: npm install

      - name: Unit and contract tests
        run: npm test

      - name: Next production build
        run: npm run app:build
