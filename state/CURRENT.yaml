project: clearance-room
source_of_truth: github
branch: product/judge-workflow-4
updated: 2026-10-04

concept:
  name: Clearance Room
  thesis: "See what breaks before a rights change goes live."
  mechanism: pre-publish rights impact analysis over a deterministic Sanity rights graph

gates:
  technical_reality_1:
    status: PROVEN
    evidence: evidence/gates/GATE-1-TECHNICAL-REALITY-PASS.md
  proof_remediation_2:
    status: PROVEN
    evidence: evidence/gates/GATE-2-PROOF-REMEDIATION-PASS.md
  knowledge_base_grounding_3:
    status: PROVEN
    evidence: evidence/gates/GATE-3-KNOWLEDGE-BASE-PASS.md
  live_product_surface_4:
    status: ACTIVE
    plan: evidence/gates/GATE-4-LIVE-PRODUCT-SURFACE-PLAN.md
    hero_flow:
      - what_breaks
      - why
      - source_evidence
      - proposed_repair
      - human_approval
      - recompile

integrations:
  context_mcp_graph_read:
    status: ACTIVE
    role: load-bearing published/drafts rights-graph read path
  live_content_api:
    status: ACTIVE
    role: realtime invalidation stream with draft changes included
  context_knowledge_base:
    status: PROVEN
    role: source-bound evidence retrieval
  content_lake_mutations:
    status: PROVEN
    role: human-approved writes and proof persistence
  ai_agent_orchestration:
    status: ACTIVE
    role: explanation/planning layer constrained by deterministic receipts
  app_sdk:
    status: ACTIVE
    role: evaluate native Sanity app surface for challenge depth
  workflows:
    status: BLOCKED
    role: approval lifecycle integration
    blocker: availability/plan and API fit not yet verified

truth_boundaries:
  - deterministic evaluator is the only authority for CLEAR/BLOCK/REVIEW/UNKNOWN
  - Knowledge Base is evidence/explanation only, never normative status authority
  - Context MCP remains read-only
  - writes use a separate Sanity mutation path
  - changed intent or governing source revision invalidates prior proof
  - repair predictions remain proposals until a real post-mutation recompile

proven_runtime:
  gate_1:
    published: CLEAR
    drafts: BLOCK
    changedAxis: paid
  gate_2:
    baselineStatus: REVIEW
    allowedThrough: 2026-10-31
