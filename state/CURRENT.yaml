truth_boundaries:
  - deterministic evaluator is the only authority for CLEAR/BLOCK/REVIEW/UNKNOWN
  - Knowledge Base is evidence/explanation only, never normative status authority
  - Context MCP remains read-only
  - writes use a separate Sanity mutation path
  - changed intent or governing source revision invalidates prior proof

